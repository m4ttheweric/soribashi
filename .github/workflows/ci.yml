name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # The test suite's browser tier runs in real Chromium via vitest's
      # browser mode; without this install those ~360 tests silently never
      # execute (MAT-120: the job was green while running none of them).
      # Placed after lint/typecheck so a cheap-check failure fast-fails before
      # paying the browser download.
      - run: bunx playwright install --with-deps chromium
      # "bun run test" runs vitest; plain "bun test" would invoke Bun's own runner
      - run: bun run test

  codegen-drift:
    name: Codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      # Regenerates packages/ui/manifest.json and registry/*.json from the
      # same recipe statics/CSS scan the tier 1 drift test
      # (packages/ui/test/manifest-drift.test.ts) already covers; this job
      # is the CI-side half of that gate, catching a committed manifest or
      # registry file nobody regenerated for.
      - run: bun run generate:ui
      # Regenerates apps/workshop/src/generated/tenants.css from the tenant
      # themes; part of the same drift gate so a hand-edited or stale
      # tenants.css fails here too.
      - run: bun run codegen:tenants
      - run: git diff --exit-code

  registry-smoke:
    name: Registry install smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # smoke:registry vendors @soribashi/core via a workspace file: link that
      # resolves through the package's exports map, which points at dist/. Since
      # the SORI-4 single-package merge, core ships built, so dist/ must exist
      # before the smoke runs (it errors "packages/core/dist does not exist"
      # otherwise).
      - run: bun run build
      # Network-dependent (resolves the shadcn CLI and real npm deps) and
      # takes minutes, which is why this is its own job and not part of
      # `bun run test`.
      - run: bun run smoke:registry

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # Same pinned image visual-baselines.yml's regeneration job uses, so
    # generation and enforcement share one renderer. Comparing on bare
    # ubuntu-latest fails 15 of 28 files on font metrics alone (MAT-121);
    # renderer parity is the entire gate. Keep this tag in lockstep with
    # package.json's @playwright/test version (currently 1.59.1).
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v5
      # The noble image ships without unzip, which setup-bun needs to extract
      # the bun archive (the local Docker regeneration command in
      # visual-baselines.yml installs it by hand for the same reason).
      # Container jobs run as root, so no sudo.
      - run: apt-get update -qq && apt-get install -y -qq unzip
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # (playwright install step removed: the container image ships the
      # matching Chromium already)
      # Compares against the committed Linux baselines
      # (packages/ui/src/recipes/*/__screenshots__/*-chromium-linux.png) and never
      # updates them. No `--update` flag is passed, and GitHub Actions sets `CI=true`
      # for every job by default; Vitest's snapshot resolution
      # (vitest/dist/chunks/coverage.*.js: `updateSnapshot: ... isCI && !UPDATE_SNAPSHOT
      # ? "none" : ...`) reads that to default `updateSnapshot` to `"none"` here, which
      # is what makes a missing baseline FAIL instead of silently creating one (verified
      # locally: `CI=true bun run test:visual` against a deleted baseline reports "No
      # existing reference screenshot found." and writes nothing to the committed
      # __screenshots__ path, only to the gitignored .vitest-attachments scratch dir).
      - run: bun run test:visual
