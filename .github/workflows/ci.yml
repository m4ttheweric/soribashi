name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # "bun run test" runs vitest; plain "bun test" would invoke Bun's own runner
      - run: bun run test

  codegen-drift:
    name: Codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      - run: git diff --exit-code

  browser:
    name: Browser parity
    runs-on: ubuntu-latest
    # Known red: apps/pilot, apps/playground and apps/shadcn-starter were removed in
    # slice 1a, and playwright.config.ts no longer has a webServer to boot the
    # `blocks` project's target on :5173. Keep non-blocking until slice 1b's
    # apps/workshop restores a server for it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
